# =========================================================
# GitHub Actions Workflow: Deploy to Koyeb (اختياري)
# =========================================================
# ملاحظة: هذا الـ Workflow اختياري — يتخطى نفسه بهدوء إن لم
# تكن قد أعددت النشر على Koyeb، فلا يسبب أي رسائل خطأ.
#
# لإعداد النشر على Koyeb:
#   1. https://app.koyeb.com/account/api → أنشئ API token
#   2. GitHub repo → Settings → Secrets and variables → Actions
#   3. أضف سراً: KOYEB_TOKEN = المفتاح
#   4. (اختياري) أضف سراً: BOT_TOKEN = توكن البوت
#   5. بعدها كل دفعة تنشر تلقائياً إلى Koyeb
# =========================================================

name: Deploy to Koyeb (optional)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # تخطَّ الجوب بالكامل إن لم يُضبط مفتاح Koyeb (لا فشل ولا بريد خطأ)
    if: ${{ secrets.KOYEB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Koyeb
        uses: koyeb/action-deploy@v1
        with:
          api_token: ${{ secrets.KOYEB_TOKEN }}
          app_name: j3-jail-bot
          service_name: bot
          service_port: 8080
          env: |
            TOKEN: ${{ secrets.BOT_TOKEN }}

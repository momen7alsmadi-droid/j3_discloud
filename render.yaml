# Render Deployment Configuration
# https://render.com - Free Tier Available
#
# How to deploy:
# 1. Push this repo to GitHub
# 2. Go to https://dashboard.render.com
# 3. Click "New +" → "Blueprint" (uses render.yaml)
#    OR "New +" → "Web Service" (connect your GitHub repo)
# 4. Set Environment Variable:
#    - Key: TOKEN
#    - Value: <your-bot-token>
#
# ملاحظة: الخدمة من نوع worker (لا تحتاج HTTP)، لكن البوت
# يتضمن خادم HTTP صغيراً (PORT أو 8080) — يعمل حتى لو أنشأت
# الخدمة كنوع Web Service.

services:
  - type: worker
    name: j3-jail-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: TOKEN
        sync: false
      - key: KEEP_ALIVE_CHANNEL_ID
        value: "1530910507408560128"
      - key: PORT
        value: "8080"

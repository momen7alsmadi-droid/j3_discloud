# =========================================================
# Render Deployment Configuration
# =========================================================
# الخدمة تبني عبر Dockerfile (نسخة Node.js) ثم تشغّل البوت.
# التوكن يُقرأ من متغير البيئة TOKEN أو من ملف .env
# (البوت لا يخرج عند غيابه — يعيد المحاولة كل 30 ثانية).

services:
  - type: worker
    name: j3-jail-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: TOKEN
        sync: false
      - key: KEEP_ALIVE_CHANNEL_ID
        value: "1530910507408560128"
      - key: PORT
        value: "8080"
